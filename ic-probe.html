<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IntelliCenter probe</title>
<style>
body{font:14px system-ui,sans-serif;margin:16px;max-width:900px}
button{padding:8px 12px;margin:3px 3px 3px 0}
input{padding:6px;width:160px}
textarea{width:100%;height:60px;font:12px monospace}
#log{background:#111;color:#cfc;padding:10px;height:420px;overflow:auto;white-space:pre-wrap;font:12px monospace;border-radius:6px}
</style></head><body>
<h2>IntelliCenter connection probe</h2>
<p>Open this file from your computer while on the home network. Try each connect button; if wss fails, first visit <a id="cert" href="#" target="_blank">the TLS address</a> once and accept the certificate warning.</p>
<div>IP <input id="ip" value="192.168.1.46"></div>
<div>
<button onclick="conn('ws','6680')">Connect ws :6680</button>
<button onclick="conn('wss','6681')">Connect wss :6681</button>
<button onclick="if(ws)ws.close()">Close</button>
</div>
<div>
<button onclick="q1()">1. Hardware definition</button>
<button onclick="q2()">2. List bodies/circuits</button>
<button onclick="q3()">3. Body details</button>
<button onclick="q4()">4. Everything (ALL)</button>
</div>
<textarea id="raw" placeholder='custom JSON to send'></textarea>
<button onclick="sendRaw()">Send custom</button>
<button onclick="navigator.clipboard.writeText(document.getElementById('log').textContent)">Copy log</button>
<div id="log"></div>
<script>
let ws=null,n=0;
const L=document.getElementById('log');
function log(s){L.textContent+=s+"\n";L.scrollTop=L.scrollHeight}
document.getElementById('cert').onclick=e=>{e.preventDefault();window.open('https://'+ip.value+':6681/')};
function conn(proto,port){
  if(ws)try{ws.close()}catch(e){}
  const u=proto+'://'+ip.value+':'+port;log('-- connecting '+u);
  try{ws=new WebSocket(u)}catch(e){log('exception '+e);return}
  ws.onopen=()=>log('OPEN '+u);
  ws.onmessage=e=>log('<< '+e.data);
  ws.onerror=()=>log('ERROR (blocked, refused, or untrusted certificate)');
  ws.onclose=e=>log('CLOSE code='+e.code+' reason='+e.reason);
}
function send(o){if(!ws||ws.readyState!==1){log('not connected');return}
  o.messageID='m'+(++n);const s=JSON.stringify(o);log('>> '+s);ws.send(s)}
function q1(){send({command:'GetQuery',queryName:'GetHardwareDefinition',arguments:''})}
function q2(){send({command:'GetParamList',condition:'',objectList:[{objnam:'INCR',keys:['OBJTYP','SUBTYP','SNAME','STATUS']}]})}
function q3(){send({command:'GetParamList',condition:'OBJTYP=BODY',objectList:[{objnam:'ALL',keys:['OBJTYP','SUBTYP','SNAME','STATUS','TEMP','LSTTMP','LOTMP','HITMP','HTMODE','HTSRC','HEATER','MODE']}]})}
function q4(){send({command:'RequestParamList',objectList:[{objnam:'ALL',keys:['OBJTYP','SUBTYP','SNAME','STATUS','LOTMP','HITMP','TEMP']}]})}
function sendRaw(){try{const o=JSON.parse(raw.value);send(o)}catch(e){log('bad JSON '+e)}}
</script></body></html>
